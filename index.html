<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede de Coautoria - MapBiomas</title>
    <!-- Cytoscape.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; background-color: #f4f6f8;}
        
        /* Painel Lateral */
        #sidebar { width: 320px; background: white; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow-y: auto; z-index: 10;}
        #sidebar h2 { font-size: 1.2em; color: #333; margin-top: 0;}
        
        /* Controles */
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 0.9em; font-weight: bold; margin-bottom: 5px; color: #555; }
        .control-group select, .control-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Painel de Informações ao clicar */
        #info-panel { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; font-size: 0.9em; color: #444; flex-grow: 1;}
        .info-title { font-weight: bold; color: #0056b3; margin-bottom: 10px; font-size: 1.1em;}
        .tag { display: inline-block; background: #e9ecef; padding: 3px 8px; border-radius: 12px; font-size: 0.8em; margin: 2px 0;}
        
        /* Grafo */
        #cy { flex-grow: 1; height: 100%; position: relative;}
        
        /* Tela de Carregamento */
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2em; color: #666; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Filtros da Rede</h2>
        
        <div class="control-group">
            <label for="searchName">Buscar Autor:</label>
            <input type="text" id="searchName" placeholder="Digite o nome...">
        </div>

        <div class="control-group">
            <label for="domainFilter">Domínio de Pesquisa:</label>
            <select id="domainFilter">
                <option value="todos">Todos os Domínios</option>
            </select>
        </div>

        <div class="control-group">
            <label for="instFilter">Instituição:</label>
            <select id="instFilter">
                <option value="todas">Todas as Instituições</option>
            </select>
        </div>

        <div id="info-panel">
            <div class="info-title">Detalhes</div>
            <p>Clique em um <b>autor (círculo)</b> ou em uma <b>conexão (linha)</b> para ver os detalhes da publicação e da coautoria aqui.</p>
        </div>
    </div>

    <div id="cy">
        <div id="loading">Carregando dados da rede...</div>
    </div>

    <script>
        // Função para preencher os Selects dinamicamente
        function populateSelect(cy, selector, attribute, defaultText) {
            const select = document.getElementById(selector);
            const uniqueValues = new Set();
            
            cy.nodes().forEach(node => {
                const val = node.data(attribute);
                if(val && val !== 'Desconhecido' && val !== 'Instituição Não Informada') {
                    uniqueValues.add(val);
                }
            });

            Array.from(uniqueValues).sort().forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                option.textContent = val;
                select.appendChild(option);
            });
        }

        // Carrega o arquivo JSON exportado pelo Python
        fetch('rede_coautoria_2017_2026.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';

                var cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: data, // Injeta os dados gerados pelo Python
                    
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#4CAF50',
                                'label': 'data(label)', // O Python exporta o nome como 'label'
                                'font-size': '10px',
                                'color': '#333',
                                'text-valign': 'bottom',
                                'text-margin-y': 5,
                                'width': '15px',
                                'height': '15px',
                                // Se for primeiro autor, coloca uma borda destacada
                                'border-width': function(ele){ return ele.data('is_first_author') == 1 ? 2 : 0; },
                                'border-color': '#000'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': function(ele) { return Math.max(1, ele.data('weight')); }, // Espessura = peso
                                'line-color': '#ccc',
                                'curve-style': 'haystack', // Haystack é mais rápido para redes grandes
                                'opacity': 0.6
                            }
                        },
                        // Estilo para destacar nós filtrados/buscados
                        {
                            selector: '.highlighted',
                            style: {
                                'background-color': '#FF5722',
                                'line-color': '#FF5722',
                                'width': '25px',
                                'height': '25px',
                                'font-size': '14px',
                                'z-index': 999
                            }
                        },
                        {
                            selector: '.faded',
                            style: { 'opacity': 0.1, 'text-opacity': 0 }
                        }
                    ],
                    layout: {
                        name: 'cose',
                        idealEdgeLength: 100,
                        nodeOverlap: 20,
                        refresh: 20,
                        fit: true,
                        padding: 30,
                        randomize: false,
                        componentSpacing: 100,
                        nodeRepulsion: 400000,
                        edgeElasticity: 100,
                        nestingFactor: 5
                    }
                });

                // Preencher menus suspensos com dados reais
                populateSelect(cy, 'domainFilter', 'domain', 'Todos os Domínios');
                populateSelect(cy, 'instFilter', 'institution', 'Todas as Instituições');

                // Lógica de Filtragem e Busca
                function applyFilters() {
                    const domain = document.getElementById('domainFilter').value;
                    const inst = document.getElementById('instFilter').value;
                    const searchText = document.getElementById('searchName').value.toLowerCase();

                    cy.elements().removeClass('faded highlighted');

                    if (domain === 'todos' && inst === 'todas' && searchText === '') return;

                    const elementsToKeep = cy.nodes().filter(function(node) {
                        const matchDomain = domain === 'todos' || node.data('domain') === domain;
                        const matchInst = inst === 'todas' || node.data('institution') === inst;
                        const matchName = searchText === '' || (node.data('label') && node.data('label').toLowerCase().includes(searchText));
                        
                        return matchDomain && matchInst && matchName;
                    });

                    cy.elements().difference(elementsToKeep).addClass('faded');
                    elementsToKeep.addClass('highlighted');
                }

                document.getElementById('domainFilter').addEventListener('change', applyFilters);
                document.getElementById('instFilter').addEventListener('change', applyFilters);
                document.getElementById('searchName').addEventListener('input', applyFilters);

                // Lógica de Clique: Painel de Informações
                const infoPanel = document.getElementById('info-panel');

                // Clique em um Autor (Nó)
                cy.on('tap', 'node', function(evt){
                    const nodeData = evt.target.data();
                    const isFirst = nodeData.is_first_author == 1 ? "<span class='tag'>Frequentemente 1º Autor</span>" : "";
                    
                    infoPanel.innerHTML = `
                        <div class="info-title">Autor: ${nodeData.label}</div>
                        ${isFirst}
                        <p><b>Instituição:</b> ${nodeData.institution}</p>
                        <p><b>Domínio:</b> ${nodeData.domain}</p>
                        <p><b>Campo:</b> ${nodeData.field}</p>
                        <p><b>Tópico:</b> ${nodeData.topic}</p>
                    `;
                });

                // Clique em uma Coautoria (Aresta)
                cy.on('tap', 'edge', function(evt){
                    const edgeData = evt.target.data();
                    const sourceNode = cy.getElementById(edgeData.source).data('label');
                    const targetNode = cy.getElementById(edgeData.target).data('label');
                    
                    // Formata os títulos separando por "|" e colocando em lista
                    const titlesList = edgeData.titles.split('|').map(t => `<li>${t.trim()}</li>`).join('');

                    infoPanel.innerHTML = `
                        <div class="info-title">Conexão de Coautoria</div>
                        <p><b>Entre:</b> ${sourceNode} e ${targetNode}</p>
                        <p><b>Artigos Juntos:</b> ${edgeData.weight}</p>
                        <p><b>Anos:</b> ${edgeData.years.replace(/\|/g, ', ')}</p>
                        <p><b>Publicações Conjuntas:</b></p>
                        <ul style="padding-left: 15px;">${titlesList}</ul>
                    `;
                });

                // Clique no fundo vazio limpa as seleções
                cy.on('tap', function(evt){
                    if(evt.target === cy){
                        cy.elements().removeClass('faded highlighted');
                        infoPanel.innerHTML = `
                            <div class="info-title">Detalhes</div>
                            <p>Clique em um <b>autor (círculo)</b> ou em uma <b>conexão (linha)</b> para ver os detalhes da publicação e da coautoria aqui.</p>
                        `;
                    }
                });

            })
            .catch(err => {
                document.getElementById('loading').innerHTML = 'Erro ao carregar o arquivo JSON. Certifique-se de que "rede_coautoria_2017_2026.json" está na mesma pasta.';
                
                console.error(err);
            });
    </script>
</body>
</html>
